# Render Blueprint — provisiona app + Postgres + sandbox front-end juntos.
# Uso: dashboard Render -> New -> Blueprint -> conectar este repositório ->
# Render detecta este arquivo automaticamente. Ver README.md, seção "Deploy".
#
# grainweighing (backend) e grainweighing-db já foram provisionados e
# testados de verdade via `render` CLI (não via "apply" deste Blueprint, que
# a CLI não suporta) — ver README.md. grainweighing-frontend (sandbox React)
# segue o mesmo padrão: CLI cria o serviço, este arquivo fica como
# documentação/IaC de referência.
services:
  - type: web
    name: grainweighing
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PGHOST
        fromDatabase:
          name: grainweighing-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: grainweighing-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: grainweighing-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: grainweighing-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: grainweighing-db
          property: password

  # Sandbox React (frontend/) — site estático, zero alteração no backend.
  # /api/* é reescrito (proxy, status 200) para o backend real, mesmo papel
  # que o proxy do Vite dev server cumpre em desenvolvimento (vite.config.ts)
  # — evita CORS sem precisar tocar no Spring Boot.
  #
  # A entrada `routes` abaixo é só documentação/IaC de referência — não é o
  # que efetivamente cria a regra. Render só aplica `routes` de render.yaml em
  # serviços sob Blueprint ativo ("New" -> "Blueprint" no dashboard); como
  # grainweighing-frontend foi criado direto via `render` CLI (mesmo padrão
  # dos outros dois serviços), a regra real foi criada com uma chamada direta
  # à API REST do Render (POST /services/{id}/routes — a CLI não tem
  # subcomando pra isso, só a API pública documentada em
  # api-docs.render.com/reference/add-route). Um arquivo `_redirects`
  # (formato Netlify) foi tentado primeiro e NÃO funciona no Render — só
  # existe pra registro do que já foi descartado.
  - type: web
    env: static
    name: grainweighing-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://grainweighing.onrender.com/api/*

databases:
  - name: grainweighing-db
    plan: free
    databaseName: grainweighing
    user: grainweighing
