# Render Blueprint — provisiona app + Postgres + sandbox front-end juntos.
# Uso: dashboard Render -> New -> Blueprint -> conectar este repositório ->
# Render detecta este arquivo automaticamente. Ver README.md, seção "Deploy".
#
# grainweighing (backend) e grainweighing-db já foram provisionados e
# testados de verdade via `render` CLI (não via "apply" deste Blueprint, que
# a CLI não suporta) — ver README.md. grainweighing-frontend (sandbox React)
# segue o mesmo padrão: CLI cria o serviço, este arquivo fica como
# documentação/IaC de referência.
services:
  - type: web
    name: grainweighing
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PGHOST
        fromDatabase:
          name: grainweighing-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: grainweighing-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: grainweighing-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: grainweighing-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: grainweighing-db
          property: password

  # Sandbox React (frontend/) — site estático, zero alteração no backend.
  # /api/* é reescrito (proxy, status 200) para o backend real, mesmo papel
  # que o proxy do Vite dev server cumpre em desenvolvimento (vite.config.ts)
  # — evita CORS sem precisar tocar no Spring Boot. A regra também está
  # duplicada em frontend/public/_redirects (formato Render/Netlify), que é
  # o mecanismo que efetivamente funciona sem precisar de "apply" de
  # Blueprint; a entrada `routes` aqui é só documentação/paridade com a
  # config real se o serviço algum dia for recriado via Blueprint de verdade.
  - type: web
    env: static
    name: grainweighing-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://grainweighing.onrender.com/api/*

databases:
  - name: grainweighing-db
    plan: free
    databaseName: grainweighing
    user: grainweighing
