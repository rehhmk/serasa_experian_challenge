services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: grainweighing
      POSTGRES_USER: grainweighing
      POSTGRES_PASSWORD: grainweighing
    ports:
      - "5432:5432"
    volumes:
      - grainweighing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grainweighing"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grainweighing
      SPRING_DATASOURCE_USERNAME: grainweighing
      SPRING_DATASOURCE_PASSWORD: grainweighing
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev-migration
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  grainweighing_pgdata:
