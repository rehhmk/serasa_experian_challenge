services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: grainweighing
      POSTGRES_USER: grainweighing
      POSTGRES_PASSWORD: grainweighing
    ports:
      - "5432:5432"
    volumes:
      - grainweighing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grainweighing"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  grainweighing_pgdata:
